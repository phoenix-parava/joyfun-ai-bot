<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Joy - Live Voice Call</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #161F33 0%, #080C14 100%);
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px 18px 28px 18px;
      overflow: hidden;
    }

    /* Screen Containers */
    .screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    /* Top Bar */
    .top-bar {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }

    .caller-name {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #FFFFFF;
    }

    .call-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 500;
      color: #94A3B8;
      text-align: center;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #10B981;
      box-shadow: 0 0 10px #10B981;
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .call-timer {
      font-size: 13px;
      color: #64748B;
      font-variant-numeric: tabular-nums;
    }

    /* Read-only Active Mode Badge (Locked during call) */
    .active-mode-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
      margin-top: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #F472B6;
    }

    /* Center Avatar Section */
    .avatar-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 190px;
      height: 190px;
      margin: auto 0;
      cursor: pointer;
    }

    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid rgba(244, 63, 94, 0.4);
      animation: pulse-ring 2.4s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    .pulse-ring.active-speaking {
      border-color: rgba(236, 72, 153, 0.8);
      animation: pulse-ring-fast 1.2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    .pulse-ring.user-speaking {
      border-color: rgba(16, 185, 129, 0.85);
      animation: pulse-ring-fast 0.9s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.9); opacity: 0.8; }
      100% { transform: scale(1.45); opacity: 0; }
    }

    @keyframes pulse-ring-fast {
      0% { transform: scale(0.9); opacity: 0.9; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .avatar {
      width: 136px;
      height: 136px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FF6B8B 0%, #7928CA 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 35px rgba(244, 63, 94, 0.35);
      border: 4px solid rgba(255, 255, 255, 0.2);
      z-index: 2;
      transition: transform 0.2s ease;
    }

    .avatar:active {
      transform: scale(0.95);
    }

    .avatar-icon {
      font-size: 60px;
    }

    /* Subtitle & Feedback Area */
    .subtitle-area {
      width: 100%;
      max-width: 330px;
      min-height: 70px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      backdrop-filter: blur(10px);
      margin-bottom: 12px;
    }

    .subtitle-text {
      font-size: 14px;
      line-height: 1.4;
      color: #E2E8F0;
      font-weight: 400;
    }

    /* Waveform Canvas */
    .wave-canvas {
      width: 100%;
      height: 32px;
      margin-bottom: 6px;
    }

    /* Bottom Call Controls (Strictly Minimal & Clean) */
    .controls-container {
      width: 100%;
      max-width: 240px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 6px;
    }

    .control-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: rgba(255, 255, 255, 0.12);
      color: #FFFFFF;
      font-size: 24px;
    }

    .control-btn:active {
      transform: scale(0.92);
    }

    .control-btn.muted {
      background: #EF4444;
      color: #FFFFFF;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
    }

    .end-call-btn {
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
      color: #FFFFFF;
      font-size: 28px;
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.45);
    }

    /* Mode Selection Card on Pre-Call Screen */
    .mode-option-btn {
      width: 100%;
      padding: 13px 16px;
      border-radius: 14px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      color: #94A3B8;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }

    .mode-option-btn.selected {
      border-color: #3B82F6;
      background: rgba(59, 130, 246, 0.18);
      color: #FFFFFF;
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3);
    }

    .mode-option-btn.selected-pink {
      border-color: #EC4899;
      background: rgba(236, 72, 153, 0.18);
      color: #FFFFFF;
      box-shadow: 0 4px 16px rgba(236, 72, 153, 0.3);
    }

    .start-call-btn {
      width: 100%;
      padding: 16px;
      border-radius: 30px;
      border: none;
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
      color: #FFFFFF;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.2s ease;
    }

    .start-call-btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <!-- ==============================================
       SCREEN 1: PRE-CALL SETUP (DECIDE MODE & START)
       ============================================== -->
  <div id="setupScreen" class="screen">
    <!-- Header -->
    <div style="text-align:center; margin-top:12px;">
      <h1 style="font-size:26px; font-weight:800; color:#FFFFFF; margin-bottom:4px;">Joy Voice Call 💖</h1>
      <p style="font-size:13px; color:#94A3B8;">Real-time, private, hands-free companion</p>
    </div>

    <!-- Center Avatar -->
    <div style="display:flex; flex-direction:column; align-items:center; gap:16px; width:100%; max-width:320px;">
      <div class="avatar" style="width:124px; height:124px; margin:0 auto; box-shadow:0 10px 40px rgba(244,63,94,0.4);">
        <div class="avatar-icon">🌸</div>
      </div>

      <!-- Mode Decision Card (Decide here or via Telegram) -->
      <div style="width:100%; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:18px; padding:16px; text-align:center;">
        <div style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:#94A3B8; margin-bottom:10px;">
          Choose Call Mode
        </div>
        <div style="display:flex; flex-direction:column; gap:10px;">
          <button type="button" class="mode-option-btn selected-pink" id="btnChooseCompanion" onclick="chooseMode('companion')">
            <span>💖 Best Friend Mode</span>
            <span style="font-size:16px;">✓</span>
          </button>
          <button type="button" class="mode-option-btn" id="btnChooseEnglish" onclick="chooseMode('english')">
            <span>📚 English Coach Mode</span>
            <span style="font-size:16px; opacity:0;">✓</span>
          </button>
        </div>
        <p id="modeDescription" style="font-size:12px; color:#94A3B8; margin-top:10px; line-height:1.4;">
          Casual day-to-day chats, laughter, and emotional venting.
        </p>
      </div>
    </div>

    <!-- Start Action -->
    <div style="width:100%; max-width:320px; margin-bottom:12px;">
      <button type="button" id="startCallBtn" class="start-call-btn" onclick="startCallNow()">
        <span>📞</span> Start Call with Joy
      </button>
      <div id="startupNote" style="text-align:center; font-size:12px; color:#64748B; margin-top:10px;">
        Tap to connect. Microphone access will be requested.
      </div>
    </div>
  </div>


  <!-- ==============================================
       SCREEN 2: ACTIVE CALL (LOCKED - NO SWITCHING)
       ============================================== -->
  <div id="callScreen" class="screen" style="display:none;">
    <!-- Top Info -->
    <div class="top-bar">
      <div class="caller-name">Joy 💖</div>
      <div class="call-status">
        <div class="status-dot" id="statusDot"></div>
        <span id="callStatusText">Connecting Call...</span>
      </div>
      <div class="call-timer" id="callTimer">00:00</div>

      <!-- Static Active Mode Badge (Locked - No switching during call) -->
      <div class="active-mode-badge" id="activeModeBadge">
        💖 Best Friend Mode
      </div>
    </div>

    <!-- Animated Glowing Avatar -->
    <div class="avatar-container" onclick="handleAvatarTap()" title="Tap to talk or interrupt">
      <div class="pulse-ring" id="pulseRing"></div>
      <div class="avatar">
        <div class="avatar-icon">🌸</div>
      </div>
    </div>

    <!-- Live Subtitles & Captions -->
    <div class="subtitle-area">
      <canvas id="waveCanvas" class="wave-canvas"></canvas>
      <div class="subtitle-text" id="subtitleText">"Connecting your private voice call with Joy..."</div>
    </div>

    <!-- Bottom Controls: Only Mute and End Call! -->
    <div class="controls-container">
      <button class="control-btn" id="muteBtn" onclick="toggleMute()" title="Mute/Unmute Mic">
        🎙️
      </button>
      <button class="control-btn end-call-btn" onclick="endCall()" title="End Call">
        ☎️
      </button>
    </div>

    <!-- Reconnect Area (Appears if disconnected) -->
    <div id="reconnectArea" style="display:none; margin-top:4px;">
      <button onclick="reconnectCall()" style="padding:8px 18px; border-radius:16px; border:1px solid #10B981; background:rgba(16,185,129,0.15); color:#10B981; font-size:13px; font-weight:700; cursor:pointer;">
        🔄 Reconnect Call
      </button>
    </div>
  </div>


  <script>
    // 1. Initialize Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor('#0F172A');
      if (tg.setBackgroundColor) tg.setBackgroundColor('#080C14');
    }

    // Parse URL Query Params
    const urlParams = new URLSearchParams(window.location.search);
    const paramMode = urlParams.get("mode");
    const paramUid = urlParams.get("uid");

    let userId = 0;
    if (tg?.initDataUnsafe?.user?.id) {
      userId = tg.initDataUnsafe.user.id;
    } else if (paramUid) {
      userId = parseInt(paramUid, 10) || 0;
    }

    // Call State (Decided before call, locked during call)
    let currentMode = (paramMode === "english") ? "english" : "companion";
    let currentVoice = "female"; // Neerja (Expressive signature natural voice)
    let callSeconds = 0;
    let timerInterval = null;
    let ws = null;
    let mediaStream = null;
    let audioContext = null;
    let micAnalyser = null;
    let scriptProcessor = null;
    let isMuted = false;
    let isJoySpeaking = false;
    let isWaitingForReply = false;
    let echoCooldownUntil = 0;
    let activeSource = null;

    // WebAudio PCM WAV Recording Buffer
    let isUserSpeaking = false;
    let audioChunks = [];
    let silenceStartTime = 0;
    const SILENCE_MS = 450;
    const SPEECH_START_ENERGY = 16;
    const SPEECH_STOP_ENERGY = 9;

    // DOM Elements
    const setupScreen = document.getElementById("setupScreen");
    const callScreen = document.getElementById("callScreen");
    const startCallBtn = document.getElementById("startCallBtn");
    const startupNote = document.getElementById("startupNote");
    const activeModeBadge = document.getElementById("activeModeBadge");
    const statusDot = document.getElementById("statusDot");
    const callStatusText = document.getElementById("callStatusText");
    const callTimer = document.getElementById("callTimer");
    const subtitleText = document.getElementById("subtitleText");
    const pulseRing = document.getElementById("pulseRing");
    const muteBtn = document.getElementById("muteBtn");
    const waveCanvas = document.getElementById("waveCanvas");
    const waveCtx = waveCanvas.getContext("2d");
    const reconnectArea = document.getElementById("reconnectArea");

    // Pre-Call Mode Selection
    function chooseMode(mode) {
      currentMode = mode;
      const btnComp = document.getElementById("btnChooseCompanion");
      const btnEng = document.getElementById("btnChooseEnglish");
      const desc = document.getElementById("modeDescription");

      if (mode === "english") {
        btnComp.className = "mode-option-btn";
        btnComp.children[1].style.opacity = "0";

        btnEng.className = "mode-option-btn selected";
        btnEng.children[1].style.opacity = "1";

        desc.innerText = "Practice spoken English fluently with gentle tips and coaching.";
      } else {
        btnComp.className = "mode-option-btn selected-pink";
        btnComp.children[1].style.opacity = "1";

        btnEng.className = "mode-option-btn";
        btnEng.children[1].style.opacity = "0";

        desc.innerText = "Casual day-to-day chats, laughter, and emotional venting.";
      }
    }

    // Apply URL pre-selected mode on load
    if (paramMode === "english") {
      chooseMode("english");
    } else {
      chooseMode("companion");
    }

    // Start Call Timer
    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        callSeconds++;
        const mins = String(Math.floor(callSeconds / 60)).padStart(2, "0");
        const secs = String(callSeconds % 60).padStart(2, "0");
        callTimer.innerText = `${mins}:${secs}`;
      }, 1000);
    }

    // Direct User Tap to Start Call (Bypasses all mobile autoplay restrictions)
    async function startCallNow() {
      startCallBtn.disabled = true;
      startCallBtn.innerHTML = "<span>⏳</span> Connecting to Joy...";
      startCallBtn.style.opacity = "0.7";
      startupNote.innerText = "Connecting microphone & cloud audio engine...";

      try {
        // 1. Initialize & resume WebAudio on direct user gesture
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioContext.state === "suspended") {
          await audioContext.resume();
        }

        // 2. Request mic permission on user gesture
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });

        micAnalyser = audioContext.createAnalyser();
        micAnalyser.fftSize = 256;
        const source = audioContext.createMediaStreamSource(mediaStream);
        source.connect(micAnalyser);

        scriptProcessor = audioContext.createScriptProcessor(4096, 1, 1);
        scriptProcessor.onaudioprocess = (e) => {
          const now = performance.now();
          if (isMuted || isJoySpeaking || isWaitingForReply || now < echoCooldownUntil) {
            return;
          }
          if (isUserSpeaking) {
            const inputData = e.inputBuffer.getChannelData(0);
            audioChunks.push(new Float32Array(inputData));
          }
        };
        source.connect(scriptProcessor);
        const silentGain = audioContext.createGain();
        silentGain.gain.value = 0;
        scriptProcessor.connect(silentGain);
        silentGain.connect(audioContext.destination);

        // 3. Switch from Setup screen to Active Call screen
        setupScreen.style.display = "none";
        callScreen.style.display = "flex";

        // Lock in static active mode badge (People CANNOT switch during call!)
        if (currentMode === "english") {
          activeModeBadge.innerText = "📚 English Coach Mode";
          activeModeBadge.style.color = "#93C5FD";
          activeModeBadge.style.borderColor = "rgba(59,130,246,0.3)";
          activeModeBadge.style.background = "rgba(59,130,246,0.12)";
        } else {
          activeModeBadge.innerText = "💖 Best Friend Mode";
          activeModeBadge.style.color = "#F472B6";
          activeModeBadge.style.borderColor = "rgba(244,114,182,0.3)";
          activeModeBadge.style.background = "rgba(244,114,182,0.12)";
        }

        waveCanvas.width = waveCanvas.offsetWidth;
        waveCanvas.height = waveCanvas.offsetHeight;
        drawWaveform();

        // 4. Connect WebSocket to Render cloud
        connectWebSocket();

      } catch (err) {
        console.error("Microphone setup error:", err);
        startCallBtn.disabled = false;
        startCallBtn.innerHTML = "<span>📞</span> Start Call with Joy";
        startCallBtn.style.opacity = "1";
        startupNote.innerText = "⚠️ Microphone permission required. Please allow access and try again.";
        alert("Microphone permission needed to speak with Joy. Please allow microphone access!");
      }
    }

    // Connect WebSocket
    function connectWebSocket() {
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      const wsUrl = `${protocol}//${location.host}/ws/call`;

      callStatusText.innerText = "Connecting to Joy...";
      statusDot.style.backgroundColor = "#F59E0B";

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        startTimer();
        callStatusText.innerText = "Connected & Ready";
        statusDot.style.backgroundColor = "#10B981";
        reconnectArea.style.display = "none";

        // Send start notification with decided mode and user id for memory
        ws.send(JSON.stringify({
          type: "call_started",
          mode: currentMode,
          voice: currentVoice,
          user_id: userId
        }));
      };

      ws.onmessage = async (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === "joy_speech") {
            handleJoySpeech(data.text, data.audio);
          } else if (data.type === "transcript") {
            if (data.text) {
              subtitleText.innerText = `You: "${data.text}"`;
            }
          } else if (data.type === "no_speech") {
            isWaitingForReply = false;
            callStatusText.innerText = "🟢 Listening... Speak freely";
            statusDot.style.backgroundColor = "#10B981";
          }
        } catch (err) {
          console.error("WS error parse:", err);
          isWaitingForReply = false;
        }
      };

      ws.onclose = () => {
        callStatusText.innerText = "Call Disconnected";
        statusDot.style.backgroundColor = "#EF4444";
        reconnectArea.style.display = "block";
      };

      ws.onerror = (e) => {
        console.error("WS connection error:", e);
        callStatusText.innerText = "Connection Issue";
        statusDot.style.backgroundColor = "#EF4444";
        reconnectArea.style.display = "block";
      };
    }

    function reconnectCall() {
      reconnectArea.style.display = "none";
      callStatusText.innerText = "Reconnecting...";
      statusDot.style.backgroundColor = "#F59E0B";
      connectWebSocket();
    }

    // Toggle Mic Mute
    function toggleMute() {
      if (!mediaStream) return;
      isMuted = !isMuted;
      mediaStream.getAudioTracks().forEach(track => track.enabled = !isMuted);
      muteBtn.classList.toggle("muted", isMuted);
      muteBtn.innerText = isMuted ? "🔇" : "🎙️";
      callStatusText.innerText = isMuted ? "Microphone Muted" : "Listening to you...";
    }

    // Tap Avatar to Force Talk / Interrupt
    function handleAvatarTap() {
      if (activeSource) {
        try { activeSource.stop(); } catch(e){}
        activeSource = null;
      }
      isJoySpeaking = false;
      isWaitingForReply = false;
      echoCooldownUntil = 0;
      pulseRing.classList.remove("active-speaking");

      if (!isUserSpeaking) {
        isUserSpeaking = true;
        silenceStartTime = 0;
        audioChunks = [];
        callStatusText.innerText = "🎙️ You are speaking...";
        statusDot.style.backgroundColor = "#3B82F6";
        pulseRing.classList.add("user-speaking");
      }
    }

    // Stop and End Call
    function endCall() {
      if (activeSource) {
        try { activeSource.stop(); } catch (e) {}
        activeSource = null;
      }
      if (mediaStream) {
        mediaStream.getTracks().forEach(t => t.stop());
      }
      if (ws) {
        ws.close();
      }
      if (timerInterval) clearInterval(timerInterval);
      
      callStatusText.innerText = "Call Ended";
      statusDot.style.backgroundColor = "#EF4444";
      subtitleText.innerText = "Call ended. Talk to you soon! 💕";

      setTimeout(() => {
        if (tg) tg.close();
        else window.close();
      }, 1000);
    }

    // 16kHz Mono 16-Bit PCM WAV Encoder
    function encodeWAV(samples, sampleRate) {
      const buffer = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buffer);

      const writeString = (offset, string) => {
        for (let i = 0; i < string.length; i++) {
          view.setUint8(offset + i, string.charCodeAt(i));
        }
      };

      writeString(0, 'RIFF');
      view.setUint32(4, 36 + samples.length * 2, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(36, 'data');
      view.setUint32(40, samples.length * 2, true);

      let offset = 44;
      for (let i = 0; i < samples.length; i++, offset += 2) {
        const s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      }

      return new Blob([view], { type: 'audio/wav' });
    }

    function downsampleBuffer(buffer, inputSampleRate, targetSampleRate = 16000) {
      if (inputSampleRate === targetSampleRate) return buffer;
      const sampleRateRatio = inputSampleRate / targetSampleRate;
      const newLength = Math.round(buffer.length / sampleRateRatio);
      const result = new Float32Array(newLength);
      let offsetResult = 0;
      let offsetBuffer = 0;
      while (offsetResult < result.length) {
        const nextOffsetBuffer = Math.round((offsetResult + 1) * sampleRateRatio);
        let accum = 0, count = 0;
        for (let i = offsetBuffer; i < nextOffsetBuffer && i < buffer.length; i++) {
          accum += buffer[i];
          count++;
        }
        result[offsetResult] = count > 0 ? (accum / count) : 0;
        offsetResult++;
        offsetBuffer = nextOffsetBuffer;
      }
      return result;
    }

    function sendRecordedAudio() {
      if (audioChunks.length === 0) return;

      let totalLength = 0;
      for (let i = 0; i < audioChunks.length; i++) {
        totalLength += audioChunks[i].length;
      }
      const mergedBuffer = new Float32Array(totalLength);
      let offset = 0;
      for (let i = 0; i < audioChunks.length; i++) {
        mergedBuffer.set(audioChunks[i], offset);
        offset += audioChunks[i].length;
      }
      audioChunks = [];

      const downsampled = downsampleBuffer(mergedBuffer, audioContext.sampleRate, 16000);
      
      if (downsampled.length < 3500) {
        callStatusText.innerText = "🟢 Listening... Speak freely";
        statusDot.style.backgroundColor = "#10B981";
        return;
      }

      let sumSq = 0;
      let peak = 0;
      for (let i = 0; i < downsampled.length; i++) {
        const absVal = Math.abs(downsampled[i]);
        if (absVal > peak) peak = absVal;
        sumSq += downsampled[i] * downsampled[i];
      }
      const rms = Math.sqrt(sumSq / downsampled.length);

      if (peak < 0.05 || rms < 0.012) {
        callStatusText.innerText = "🟢 Listening... Speak freely";
        statusDot.style.backgroundColor = "#10B981";
        return;
      }

      isWaitingForReply = true;
      callStatusText.innerText = "⏳ Joy is thinking...";
      statusDot.style.backgroundColor = "#F59E0B";
      pulseRing.classList.remove("user-speaking");

      const wavBlob = encodeWAV(downsampled, 16000);
      const reader = new FileReader();
      reader.readAsDataURL(wavBlob);
      reader.onloadend = () => {
        const base64Audio = reader.result.split(',')[1];
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: "voice_chunk",
            audio: base64Audio,
            mime_type: "audio/wav",
            mode: currentMode,
            voice: currentVoice,
            user_id: userId
          }));
        } else {
          isWaitingForReply = false;
          callStatusText.innerText = "🟢 Listening... Speak freely";
          statusDot.style.backgroundColor = "#10B981";
        }
      };
    }

    async function handleJoySpeech(text, base64Audio) {
      if (activeSource) {
        try { activeSource.stop(); } catch (e) {}
        activeSource = null;
      }

      isJoySpeaking = true;
      isWaitingForReply = false;
      isUserSpeaking = false;
      audioChunks = [];
      pulseRing.classList.remove("user-speaking");
      pulseRing.classList.add("active-speaking");
      callStatusText.innerText = "🌸 Joy is speaking...";
      statusDot.style.backgroundColor = "#EC4899";
      subtitleText.innerText = `Joy: "${text}"`;

      if (audioContext && audioContext.state === "suspended") {
        try { await audioContext.resume(); } catch (e) {}
      }

      try {
        const binaryString = atob(base64Audio);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }

        const audioBuffer = await audioContext.decodeAudioData(bytes.buffer.slice(0));
        activeSource = audioContext.createBufferSource();
        activeSource.buffer = audioBuffer;
        activeSource.connect(audioContext.destination);

        activeSource.onended = () => {
          isJoySpeaking = false;
          activeSource = null;
          pulseRing.classList.remove("active-speaking");
          echoCooldownUntil = performance.now() + 250;
          isWaitingForReply = false;
          audioChunks = [];
          callStatusText.innerText = "🟢 Listening... Speak freely";
          statusDot.style.backgroundColor = "#10B981";
        };

        activeSource.start(0);
      } catch (err) {
        console.error("Audio decode error:", err);
        isJoySpeaking = false;
        isWaitingForReply = false;
        pulseRing.classList.remove("active-speaking");
        callStatusText.innerText = "🟢 Listening... Speak freely";
        statusDot.style.backgroundColor = "#10B981";
      }
    }

    function drawWaveform() {
      requestAnimationFrame(drawWaveform);
      if (!micAnalyser) return;

      const now = performance.now();
      const bufferLength = micAnalyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      micAnalyser.getByteFrequencyData(dataArray);

      let sum = 0;
      for (let i = 0; i < bufferLength; i++) {
        sum += dataArray[i];
      }
      const avg = sum / bufferLength;

      waveCtx.clearRect(0, 0, waveCanvas.width, waveCanvas.height);
      waveCtx.lineWidth = 2.5;
      waveCtx.strokeStyle = isJoySpeaking ? "#EC4899" : (isUserSpeaking ? "#10B981" : "#64748B");
      waveCtx.beginPath();

      const sliceWidth = waveCanvas.width / bufferLength;
      let x = 0;
      for (let i = 0; i < bufferLength; i++) {
        const v = isJoySpeaking 
          ? (0.5 + 0.3 * Math.sin(now * 0.015 + i * 0.25)) 
          : (dataArray[i] / 128.0);
        const y = (v * waveCanvas.height) / 2;
        if (i === 0) waveCtx.moveTo(x, y);
        else waveCtx.lineTo(x, y);
        x += sliceWidth;
      }
      waveCtx.stroke();

      if (isJoySpeaking || isWaitingForReply || now < echoCooldownUntil || isMuted) {
        if (isUserSpeaking) {
          isUserSpeaking = false;
          audioChunks = [];
          pulseRing.classList.remove("user-speaking");
        }
        return;
      }

      if (!isUserSpeaking) {
        if (avg > SPEECH_START_ENERGY) {
          isUserSpeaking = true;
          silenceStartTime = 0;
          audioChunks = [];
          callStatusText.innerText = "🎙️ You are speaking...";
          statusDot.style.backgroundColor = "#3B82F6";
          pulseRing.classList.add("user-speaking");
        }
      } else {
        if (avg > SPEECH_STOP_ENERGY) {
          silenceStartTime = 0;
        } else {
          if (silenceStartTime === 0) {
            silenceStartTime = now;
          } else if (now - silenceStartTime > SILENCE_MS) {
            isUserSpeaking = false;
            silenceStartTime = 0;
            pulseRing.classList.remove("user-speaking");
            sendRecordedAudio();
          }
        }
      }
    }
  </script>
