<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Joy - Live Voice Call</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #161F33 0%, #080C14 100%);
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 24px 20px 36px 20px;
      overflow: hidden;
    }

    /* Top Bar */
    .top-bar {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
    }

    .caller-name {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #FFFFFF;
    }

    .call-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 500;
      color: #94A3B8;
      text-align: center;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #10B981;
      box-shadow: 0 0 10px #10B981;
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .call-timer {
      font-size: 13px;
      color: #64748B;
      font-variant-numeric: tabular-nums;
    }

    /* Mode Pill Selector */
    .mode-pill {
      display: flex;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 30px;
      padding: 3px;
      margin-top: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .mode-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: none;
      background: transparent;
      color: #94A3B8;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: #3B82F6;
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
    }

    /* Center Avatar Section */
    .avatar-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 200px;
      height: 200px;
      margin: auto 0;
      cursor: pointer;
    }

    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid rgba(244, 63, 94, 0.4);
      animation: pulse-ring 2.4s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    .pulse-ring.active-speaking {
      border-color: rgba(236, 72, 153, 0.8);
      animation: pulse-ring-fast 1.2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    .pulse-ring.user-speaking {
      border-color: rgba(16, 185, 129, 0.85);
      animation: pulse-ring-fast 0.9s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.9); opacity: 0.8; }
      100% { transform: scale(1.45); opacity: 0; }
    }

    @keyframes pulse-ring-fast {
      0% { transform: scale(0.9); opacity: 0.9; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FF6B8B 0%, #7928CA 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 35px rgba(244, 63, 94, 0.35);
      border: 4px solid rgba(255, 255, 255, 0.2);
      z-index: 2;
      transition: transform 0.2s ease;
    }

    .avatar:active {
      transform: scale(0.95);
    }

    .avatar-icon {
      font-size: 64px;
    }

    /* Subtitle & Feedback Area */
    .subtitle-area {
      width: 100%;
      max-width: 320px;
      min-height: 70px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      backdrop-filter: blur(10px);
      margin-bottom: 16px;
    }

    .subtitle-text {
      font-size: 14px;
      line-height: 1.4;
      color: #E2E8F0;
      font-weight: 400;
    }

    /* Waveform Canvas */
    .wave-canvas {
      width: 100%;
      height: 36px;
      margin-bottom: 8px;
    }

    /* Bottom Call Controls */
    .controls-container {
      width: 100%;
      max-width: 300px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 6px;
    }

    .control-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: none;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: rgba(255, 255, 255, 0.12);
      color: #FFFFFF;
      font-size: 22px;
    }

    .control-btn:active {
      transform: scale(0.92);
    }

    .control-btn.active-mic {
      background: #10B981;
      color: #FFFFFF;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.5);
    }

    .control-btn.muted {
      background: #EF4444;
      color: #FFFFFF;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
    }

    .end-call-btn {
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
      color: #FFFFFF;
      font-size: 28px;
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.45);
    }

    .end-call-btn:active {
      transform: scale(0.9);
    }

    /* Voice Selection Pill */
    .voice-select-text {
      font-size: 12px;
      color: #94A3B8;
      margin-top: 4px;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>

  <!-- Top Info -->
  <div class="top-bar">
    <div class="caller-name">Joy 💖</div>
    <div class="call-status">
      <div class="status-dot" id="statusDot"></div>
      <span id="callStatusText">Connecting Call...</span>
    </div>
    <div class="call-timer" id="callTimer">00:00</div>

    <!-- Mode Selector -->
    <div class="mode-pill">
      <button class="mode-btn active" id="btnModeCompanion" onclick="setMode('companion')">💖 Best Friend</button>
      <button class="mode-btn" id="btnModeEnglish" onclick="setMode('english')">📚 English Coach</button>
    </div>
  </div>

  <!-- Animated Glowing Avatar (Tap to Talk / Tap to Interrupt) -->
  <div class="avatar-container" onclick="handleAvatarTap()" title="Tap to talk or interrupt">
    <div class="pulse-ring" id="pulseRing"></div>
    <div class="avatar">
      <div class="avatar-icon">🌸</div>
    </div>
  </div>

  <!-- Live Subtitles & Captions -->
  <div class="subtitle-area">
    <canvas id="waveCanvas" class="wave-canvas"></canvas>
    <div class="subtitle-text" id="subtitleText">"Connecting your private voice call with Joy..."</div>
  </div>

  <!-- Bottom Call Controls -->
  <div class="controls-container">
    <!-- Mic Toggle -->
    <button class="control-btn" id="muteBtn" onclick="toggleMute()" title="Mute/Unmute Mic">
      🎙️
    </button>

    <!-- End Call Button -->
    <button class="control-btn end-call-btn" onclick="endCall()" title="End Call">
      ☎️
    </button>

    <!-- Voice Cycle Button -->
    <button class="control-btn" id="voiceToggleBtn" onclick="cycleVoice()" title="Switch Voice">
      🌸
    </button>
  </div>
  <div class="voice-select-text" id="voiceLabel" onclick="cycleVoice()">Voice: Jenny (Sweet Female)</div>

  <script>
    // 1. Initialize Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor('#0F172A');
      if (tg.setBackgroundColor) tg.setBackgroundColor('#080C14');
    }

    // Call State
    let currentMode = "companion";
    let currentVoice = "female"; // female (Jenny), indian (Neerja), hindi (Swara), male (Prabhat)
    let callSeconds = 0;
    let timerInterval = null;
    let ws = null;
    let mediaStream = null;
    let audioContext = null;
    let micAnalyser = null;
    let scriptProcessor = null;
    let isMuted = false;
    let isJoySpeaking = false;
    let isWaitingForReply = false;
    let echoCooldownUntil = 0;
    let activeSource = null;

    // WebAudio PCM WAV Recording Buffer
    let isUserSpeaking = false;
    let audioChunks = [];
    let silenceStartTime = 0;
    const SILENCE_MS = 800;          // 800ms natural conversational pause
    const SPEECH_START_ENERGY = 20;  // Threshold (out of 255) to trigger speaking
    const SPEECH_STOP_ENERGY = 12;   // Threshold to sustain speaking

    // DOM Elements
    const statusDot = document.getElementById("statusDot");
    const callStatusText = document.getElementById("callStatusText");
    const callTimer = document.getElementById("callTimer");
    const subtitleText = document.getElementById("subtitleText");
    const pulseRing = document.getElementById("pulseRing");
    const muteBtn = document.getElementById("muteBtn");
    const waveCanvas = document.getElementById("waveCanvas");
    const waveCtx = waveCanvas.getContext("2d");
    const voiceLabel = document.getElementById("voiceLabel");
    const voiceToggleBtn = document.getElementById("voiceToggleBtn");

    // Start Call Timer
    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        callSeconds++;
        const mins = String(Math.floor(callSeconds / 60)).padStart(2, "0");
        const secs = String(callSeconds % 60).padStart(2, "0");
        callTimer.innerText = `${mins}:${secs}`;
      }, 1000);
    }

    // Switch Mode
    function setMode(mode) {
      currentMode = mode;
      document.getElementById("btnModeCompanion").classList.toggle("active", mode === "companion");
      document.getElementById("btnModeEnglish").classList.toggle("active", mode === "english");
      const modeLabel = mode === "companion" ? "Best Friend Mode" : "English Coach Mode";
      callStatusText.innerText = `Switched to ${modeLabel}`;
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "mode_change", mode: currentMode }));
      }
    }

    // Voices Options
    const voices = [
      { id: "female", name: "Jenny (Sweet Female)", icon: "🌸" },
      { id: "indian", name: "Neerja (Indian Female)", icon: "🇮🇳" },
      { id: "hindi", name: "Swara (Hindi Female)", icon: "🌺" },
      { id: "male", name: "Prabhat (Male)", icon: "👨" }
    ];
    let voiceIdx = 0;

    function cycleVoice() {
      voiceIdx = (voiceIdx + 1) % voices.length;
      currentVoice = voices[voiceIdx].id;
      voiceToggleBtn.innerText = voices[voiceIdx].icon;
      voiceLabel.innerText = `Voice: ${voices[voiceIdx].name}`;
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "voice_change", voice: currentVoice }));
      }
    }

    // Toggle Mic Mute
    function toggleMute() {
      if (!mediaStream) return;
      isMuted = !isMuted;
      mediaStream.getAudioTracks().forEach(track => track.enabled = !isMuted);
      muteBtn.classList.toggle("muted", isMuted);
      muteBtn.innerText = isMuted ? "🔇" : "🎙️";
      callStatusText.innerText = isMuted ? "Microphone Muted" : "Listening to you...";
    }

    // Tap Avatar to Force Talk / Interrupt
    function handleAvatarTap() {
      if (activeSource) {
        try { activeSource.stop(); } catch(e){}
        activeSource = null;
      }
      isJoySpeaking = false;
      isWaitingForReply = false;
      echoCooldownUntil = 0;
      pulseRing.classList.remove("active-speaking");

      // Force start user turn
      if (!isUserSpeaking) {
        isUserSpeaking = true;
        silenceStartTime = 0;
        audioChunks = [];
        callStatusText.innerText = "🎙️ You are speaking...";
        statusDot.style.backgroundColor = "#3B82F6";
        pulseRing.classList.add("user-speaking");
      }
    }

    // Stop and End Call
    function endCall() {
      if (activeSource) {
        try { activeSource.stop(); } catch (e) {}
        activeSource = null;
      }
      if (mediaStream) {
        mediaStream.getTracks().forEach(t => t.stop());
      }
      if (ws) {
        ws.close();
      }
      if (timerInterval) clearInterval(timerInterval);
      
      callStatusText.innerText = "Call Ended";
      statusDot.style.backgroundColor = "#EF4444";
      subtitleText.innerText = "Call ended. Talk to you soon! 💕";

      setTimeout(() => {
        if (tg) tg.close();
        else window.close();
      }, 1000);
    }

    // 16kHz Mono 16-Bit PCM WAV Encoder
    function encodeWAV(samples, sampleRate) {
      const buffer = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buffer);

      const writeString = (offset, string) => {
        for (let i = 0; i < string.length; i++) {
          view.setUint8(offset + i, string.charCodeAt(i));
        }
      };

      /* RIFF identifier */
      writeString(0, 'RIFF');
      /* file length */
      view.setUint32(4, 36 + samples.length * 2, true);
      /* RIFF type */
      writeString(8, 'WAVE');
      /* format chunk identifier */
      writeString(12, 'fmt ');
      /* format chunk length */
      view.setUint32(16, 16, true);
      /* sample format (raw PCM = 1) */
      view.setUint16(20, 1, true);
      /* channel count (1 = mono) */
      view.setUint16(22, 1, true);
      /* sample rate */
      view.setUint32(24, sampleRate, true);
      /* byte rate (sampleRate * 2) */
      view.setUint32(28, sampleRate * 2, true);
      /* block align (channel count * bytes per sample) */
      view.setUint16(32, 2, true);
      /* bits per sample */
      view.setUint16(34, 16, true);
      /* data chunk identifier */
      writeString(36, 'data');
      /* data chunk length */
      view.setUint32(40, samples.length * 2, true);

      // Write 16-bit PCM samples
      let offset = 44;
      for (let i = 0; i < samples.length; i++, offset += 2) {
        const s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      }

      return new Blob([view], { type: 'audio/wav' });
    }

    // Downsample buffer to 16kHz mono
    function downsampleBuffer(buffer, inputSampleRate, targetSampleRate = 16000) {
      if (inputSampleRate === targetSampleRate) return buffer;
      const sampleRateRatio = inputSampleRate / targetSampleRate;
      const newLength = Math.round(buffer.length / sampleRateRatio);
      const result = new Float32Array(newLength);
      let offsetResult = 0;
      let offsetBuffer = 0;
      while (offsetResult < result.length) {
        const nextOffsetBuffer = Math.round((offsetResult + 1) * sampleRateRatio);
        let accum = 0, count = 0;
        for (let i = offsetBuffer; i < nextOffsetBuffer && i < buffer.length; i++) {
          accum += buffer[i];
          count++;
        }
        result[offsetResult] = count > 0 ? (accum / count) : 0;
        offsetResult++;
        offsetBuffer = nextOffsetBuffer;
      }
      return result;
    }

    // Send user audio turn to Joy
    function sendRecordedAudio() {
      if (audioChunks.length === 0) return;

      // Merge recorded chunks
      let totalLength = 0;
      for (let i = 0; i < audioChunks.length; i++) {
        totalLength += audioChunks[i].length;
      }
      const mergedBuffer = new Float32Array(totalLength);
      let offset = 0;
      for (let i = 0; i < audioChunks.length; i++) {
        mergedBuffer.set(audioChunks[i], offset);
        offset += audioChunks[i].length;
      }
      audioChunks = [];

      // Downsample to 16kHz
      const downsampled = downsampleBuffer(mergedBuffer, audioContext.sampleRate, 16000);
      
      // Ignore if too short (< 0.4s: 6400 samples at 16kHz)
      if (downsampled.length < 6400) {
        callStatusText.innerText = "🟢 Listening... Speak freely";
        statusDot.style.backgroundColor = "#10B981";
        return;
      }

      // Energy check: Check RMS and peak to discard room hiss or breathing
      let sumSq = 0;
      let peak = 0;
      for (let i = 0; i < downsampled.length; i++) {
        const absVal = Math.abs(downsampled[i]);
        if (absVal > peak) peak = absVal;
        sumSq += downsampled[i] * downsampled[i];
      }
      const rms = Math.sqrt(sumSq / downsampled.length);

      if (peak < 0.05 || rms < 0.012) {
        console.log("Audio chunk too quiet/silent (peak=" + peak.toFixed(3) + ", rms=" + rms.toFixed(4) + "), skipped.");
        callStatusText.innerText = "🟢 Listening... Speak freely";
        statusDot.style.backgroundColor = "#10B981";
        return;
      }

      // Enter waiting lock to prevent overlapping chunks
      isWaitingForReply = true;
      callStatusText.innerText = "⏳ Joy is thinking...";
      statusDot.style.backgroundColor = "#F59E0B";
      pulseRing.classList.remove("user-speaking");

      const wavBlob = encodeWAV(downsampled, 16000);
      const reader = new FileReader();
      reader.readAsDataURL(wavBlob);
      reader.onloadend = () => {
        const base64Audio = reader.result.split(',')[1];
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: "voice_chunk",
            audio: base64Audio,
            mime_type: "audio/wav",
            mode: currentMode,
            voice: currentVoice
          }));
        } else {
          isWaitingForReply = false;
          callStatusText.innerText = "🟢 Listening... Speak freely";
          statusDot.style.backgroundColor = "#10B981";
        }
      };
    }

    // Initialize Audio & Mic
    async function initAudio() {
      try {
        callStatusText.innerText = "Connecting microphone...";
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === "suspended") {
          await audioContext.resume();
        }

        micAnalyser = audioContext.createAnalyser();
        micAnalyser.fftSize = 256;
        const source = audioContext.createMediaStreamSource(mediaStream);
        source.connect(micAnalyser);

        // ScriptProcessor captures raw audio for robust WAV encoding
        scriptProcessor = audioContext.createScriptProcessor(4096, 1, 1);
        scriptProcessor.onaudioprocess = (e) => {
          const now = performance.now();
          // Strictly ignore audio if muted, Joy is speaking, waiting for reply, or in echo cooldown
          if (isMuted || isJoySpeaking || isWaitingForReply || now < echoCooldownUntil) {
            return;
          }

          if (isUserSpeaking) {
            const inputData = e.inputBuffer.getChannelData(0);
            audioChunks.push(new Float32Array(inputData));
          }
        };
        source.connect(scriptProcessor);
        const silentGain = audioContext.createGain();
        silentGain.gain.value = 0;
        scriptProcessor.connect(silentGain);
        silentGain.connect(audioContext.destination);

        drawWaveform();
        connectWebSocket();
      } catch (err) {
        console.error("Microphone error:", err);
        callStatusText.innerText = "Mic Permission Needed";
        subtitleText.innerText = "Please allow microphone access to talk with Joy!";
        statusDot.style.backgroundColor = "#EF4444";
      }
    }

    // Connect WebSocket
    function connectWebSocket() {
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      const wsUrl = `${protocol}//${location.host}/ws/call`;

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        startTimer();
        callStatusText.innerText = "Connected & Ready";
        statusDot.style.backgroundColor = "#10B981";
        // Request initial greeting
        ws.send(JSON.stringify({
          type: "call_started",
          mode: currentMode,
          voice: currentVoice
        }));
      };

      ws.onmessage = async (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === "joy_speech") {
            handleJoySpeech(data.text, data.audio);
          } else if (data.type === "transcript") {
            if (data.text) {
              subtitleText.innerText = `You: "${data.text}"`;
            }
          } else if (data.type === "no_speech") {
            // Silence or noise detected: unlock client cleanly
            isWaitingForReply = false;
            callStatusText.innerText = "🟢 Listening... Speak freely";
            statusDot.style.backgroundColor = "#10B981";
          }
        } catch (err) {
          console.error("WS error parse:", err);
          isWaitingForReply = false;
        }
      };

      ws.onclose = () => {
        callStatusText.innerText = "Call Disconnected";
        statusDot.style.backgroundColor = "#EF4444";
      };

      ws.onerror = (e) => {
        console.error("WS connection error:", e);
      };
    }

    // Play Joy's Spoken Response
    async function handleJoySpeech(text, base64Audio) {
      if (activeSource) {
        try { activeSource.stop(); } catch (e) {}
        activeSource = null;
      }

      isJoySpeaking = true;
      isWaitingForReply = false;
      isUserSpeaking = false;
      audioChunks = [];
      pulseRing.classList.remove("user-speaking");
      pulseRing.classList.add("active-speaking");
      callStatusText.innerText = "🌸 Joy is speaking...";
      statusDot.style.backgroundColor = "#EC4899";
      subtitleText.innerText = `Joy: "${text}"`;

      if (audioContext && audioContext.state === "suspended") {
        try { await audioContext.resume(); } catch (e) {}
      }

      try {
        const binaryString = atob(base64Audio);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }

        const audioBuffer = await audioContext.decodeAudioData(bytes.buffer.slice(0));
        activeSource = audioContext.createBufferSource();
        activeSource.buffer = audioBuffer;
        activeSource.connect(audioContext.destination);

        activeSource.onended = () => {
          isJoySpeaking = false;
          activeSource = null;
          pulseRing.classList.remove("active-speaking");
          // 400ms cooldown to allow room acoustics and speaker reverberation to dissipate
          echoCooldownUntil = performance.now() + 400;
          isWaitingForReply = false;
          audioChunks = [];
          callStatusText.innerText = "🟢 Listening... Speak freely";
          statusDot.style.backgroundColor = "#10B981";
        };

        activeSource.start(0);
      } catch (err) {
        console.error("Audio decode error:", err);
        isJoySpeaking = false;
        isWaitingForReply = false;
        pulseRing.classList.remove("active-speaking");
        callStatusText.innerText = "🟢 Listening... Speak freely";
        statusDot.style.backgroundColor = "#10B981";
      }
    }

    // Voice Activity Detection & Canvas Animation
    function drawWaveform() {
      requestAnimationFrame(drawWaveform);
      if (!micAnalyser) return;

      const now = performance.now();
      const bufferLength = micAnalyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      micAnalyser.getByteFrequencyData(dataArray);

      let sum = 0;
      for (let i = 0; i < bufferLength; i++) {
        sum += dataArray[i];
      }
      const avg = sum / bufferLength;

      // Draw Waveform on Canvas
      waveCtx.clearRect(0, 0, waveCanvas.width, waveCanvas.height);
      waveCtx.lineWidth = 2.5;
      waveCtx.strokeStyle = isJoySpeaking ? "#EC4899" : (isUserSpeaking ? "#10B981" : "#64748B");
      waveCtx.beginPath();

      const sliceWidth = waveCanvas.width / bufferLength;
      let x = 0;
      for (let i = 0; i < bufferLength; i++) {
        const v = isJoySpeaking 
          ? (0.5 + 0.3 * Math.sin(now * 0.015 + i * 0.25)) 
          : (dataArray[i] / 128.0);
        const y = (v * waveCanvas.height) / 2;
        if (i === 0) waveCtx.moveTo(x, y);
        else waveCtx.lineTo(x, y);
        x += sliceWidth;
      }
      waveCtx.stroke();

      // Skip VAD when Joy is speaking, waiting for reply, during echo cooldown, or muted
      if (isJoySpeaking || isWaitingForReply || now < echoCooldownUntil || isMuted) {
        if (isUserSpeaking) {
          isUserSpeaking = false;
          audioChunks = [];
          pulseRing.classList.remove("user-speaking");
        }
        return;
      }

      // Voice Activity Detection with hysteresis
      if (!isUserSpeaking) {
        if (avg > SPEECH_START_ENERGY) {
          isUserSpeaking = true;
          silenceStartTime = 0;
          audioChunks = [];
          callStatusText.innerText = "🎙️ You are speaking...";
          statusDot.style.backgroundColor = "#3B82F6";
          pulseRing.classList.add("user-speaking");
        }
      } else {
        if (avg > SPEECH_STOP_ENERGY) {
          silenceStartTime = 0;
        } else {
          if (silenceStartTime === 0) {
            silenceStartTime = now;
          } else if (now - silenceStartTime > SILENCE_MS) {
            isUserSpeaking = false;
            silenceStartTime = 0;
            pulseRing.classList.remove("user-speaking");
            sendRecordedAudio();
          }
        }
      }
    }

    // Autoplay Unlocker
    const unlockAudio = () => {
      if (audioContext && audioContext.state === "suspended") {
        audioContext.resume();
      }
    };
    window.addEventListener("click", unlockAudio);
    window.addEventListener("touchstart", unlockAudio);

    window.addEventListener("DOMContentLoaded", () => {
      waveCanvas.width = waveCanvas.offsetWidth;
      waveCanvas.height = waveCanvas.offsetHeight;
      initAudio();
    });
  </script>
</body>
</html>
